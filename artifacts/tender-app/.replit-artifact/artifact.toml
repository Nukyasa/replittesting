kind = "web"
previewPath = "/"
title = "ASA Tender Intelligence"
version = "1.0.0"
id = "artifacts/tender-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19810

[services.development]
run = "pnpm --filter @workspace/tender-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tender-app", "run", "build" ]
publicDir = "artifacts/tender-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19810"
BASE_PATH = "/"
